explainer:
  no_reply_prefix: "⚠️ उत्तर नहीं: "
  empty_response: "{model} ने पुनर्प्रयासों के बाद भी इस बार उत्तर नहीं दिया। `continue` भेजें या /model से मॉडल बदलें।"
  exit:
    all_retries_exhausted_no_response: "सभी पुनर्प्रयास के बाद मॉडल प्रदाता ने उत्तर नहीं दिया। /retry भेजें या /model से बदलें।"
    partial_stream_recovery: "स्ट्रीमिंग जल्दी रुकी और केवल आंशिक उत्तर मिला। जहाँ रुका वहाँ से जारी करने के लिए `continue` भेजें।"
    fallback_prior_turn_content: "इस बारी नई सामग्री नहीं बनी; पुराना बहाल संदर्भ दिख रहा है। फिर कोशिश के लिए `continue`।"
    redirect_restart_limit_exceeded: "हर प्रयास नए सुधार से रद्द हुआ, इसलिए अनंत पुनर्प्रयास की जगह बारी रुकी। अंतिम सुधार अगले संदेश की कतार में है।"
    rebuilt_restart_limit_exceeded: "वैकल्पिक प्रदाताओं की पूरी शृंखला विफल होती रही, इसलिए अनंत कोशिश की जगह बारी रुकी। `continue` भेजें या प्रदाता बदलें।"
    budget_exhausted: "अंतिम उत्तर से पहले प्रति-बारी पुनरावृत्ति/लागत सीमा समाप्त। जारी करने के लिए `continue`।"
    ollama_runtime_context_too_small: "स्थानीय मॉडल की संदर्भ विंडो पूरी करने के लिए छोटी थी। आकार बढ़ाएँ या बड़ा मॉडल लें।"
    pending_tool_result: "टूल परिणाम लंबित रहते बारी रुकी और मॉडल ने आगे पाठ नहीं दिया। सार के लिए `continue`।"
    interrupted_during_api_call: "उत्तर से पहले बीच कॉल में अनुरोध बाधित हुआ। फिर कोशिश के लिए `continue`।"
    max_iterations_reached: "अंतिम उत्तर से पहले अधिकतम टूल-पुनरावृत्ति सीमा पूरी। `continue` भेजें या `max_iterations` बढ़ाएँ।"
    error_near_max_iterations: "अंतिम उत्तर से पहले पुनरावृत्ति सीमा के पास त्रुटि हुई। ऊपर टूल आउटपुट जाँचकर `continue` भेजें।"
    repeated_outer_errors: "बारी बार-बार त्रुटि से विफल हुई, अनंत कोशिश की जगह जल्दी रोकी। ऊपर त्रुटियाँ जाँचकर `continue` भेजें।"
  persistence:
    compression: "दूसरी प्रक्रिया इस सत्र को संपीड़ित कर रही थी, इसलिए बारी रुकी। संदेश पहले सहेजा होना चाहिए — संपीड़न पूरा होने पर फिर भेजें।"
    compression_closed: "संदर्भ संपीड़न ने सत्र बदला और सक्रिय अगला सत्र अपनाया नहीं जा सका, इसलिए बारी रुकी। संग्रह सुरक्षित है — क्लाइंट ताज़ा करें (या नई बारी) ताकि नई सत्र ID मिले, फिर संदेश भेजें।"
    turn_lease: "दूसरी {app_name} प्रक्रिया ने सत्र सँभाला, इसलिए बारी रुकी। उत्तर सहेजा नहीं — दूसरी प्रक्रिया पूरी होने पर संदेश फिर भेजें।"
    session_row_missing: "चैट खुली रहते सत्र संग्रह से मिटा और {app_name} फिर नहीं बना सका, इसलिए संदेश सहेजा नहीं। फिर भेजें; बार-बार हो तो `hermes {profile_arg}doctor`।"
    locked: "सत्र संग्रह व्यस्त था (दूसरी {app_name} प्रक्रिया स्थिति डेटाबेस में लिख रही थी), इसलिए बारी रुकी। संदेश पहले सहेजा होना चाहिए — थोड़ी देर में फिर भेजें।"
    replaced: "{app_name} चलते समय डेटाबेस फ़ाइल बदली, संदेश सहेजा नहीं (प्रति {home}/sessions/ में है)। {app_name} रोकें (`hermes {profile_arg}gateway stop`), `hermes {profile_arg}doctor` चलाएँ — `hermes {profile_arg}doctor --fix` नहीं, वह गलत फ़ाइल सुधार देगा — फिर शुरू करके संदेश भेजें। उन्नत बहाली चरण लॉग में हैं।"
    deleted_wal: "दूसरी {app_name} प्रक्रिया डेटाबेस के write-ahead लॉग की पुरानी प्रति पकड़े है, इसलिए {app_name} का लेखन सुरक्षा के लिए रुका और संदेश सहेजा नहीं (प्रति {home}/sessions/ में है)। कुछ नहीं खोया। इस प्रोफ़ाइल की सभी {app_name} प्रक्रियाएँ बंद करें (डेस्कटॉप ऐप, `hermes {profile_arg}gateway stop`, डैशबोर्ड, क्रॉन), `hermes {profile_arg}doctor` चलाएँ — लॉग पकड़े प्रक्रिया बताएगा — फिर {app_name} शुरू करके संदेश भेजें। उनके चलते `doctor --fix` न चलाएँ और state.db न मिटाएँ। मार्गदर्शिका: {recovery_docs}"
    corrupt: "स्थिति डेटाबेस ने संरचनात्मक भ्रष्टाचार बताया, इसलिए बारी रुकी (पुनः शुरू करने पर प्रतिलेख खो जाता)। डिस्क खाली करना मदद नहीं करेगा। बहाली विकल्प:\n1. `hermes {profile_arg}doctor --fix` चलाएँ\n2. गेटवे रोकें, फिर बहाल करें:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (बहाली संभव बताए तो) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — पहले क्षतिग्रस्त फ़ाइल का स्नैपशॉट लिया जाता है; चलती state.db पर `sqlite3 ... \".recover\"` न चलाएँ, असुरक्षित sqlite3 CLI और नुकसान कर सकता है\n3. {backups_dir}/ से बैकअप बहाल करें\nफिर संदेश भेजें।"
    fts_index: "सत्र खोज सूचकांक (FTS5) भ्रष्ट और अलग नहीं हो सका, इसलिए बारी रुकी और संदेश सहेजा नहीं। संदेश संग्रह सुरक्षित: बहाली टूल या बैकअप न लें। `hermes {profile_arg}doctor --fix` चलाएँ (या {app_name} पुनः शुरू करें, खोलने पर सूचकांक सुधरता है), फिर संदेश भेजें।"
    disk: "{app_name} बातचीत डिस्क पर नहीं सहेज सका, इसलिए संदेश खोने की जगह रुका। शायद डिस्क भरी है: जगह खाली करें (या {home}/state.db की अनुमति ठीक करें), फिर संदेश भेजें।"
    default: "{app_name} बातचीत नहीं सहेज सका, इसलिए संदेश खोने की जगह रुका। संभव कारण: डिस्क भरी या दूसरी {app_name} प्रक्रिया डेटाबेस पकड़े है। दूसरी {app_name} विंडो बंद करें, `hermes {profile_arg}doctor` से संग्रह जाँचें, फिर संदेश भेजें।"
  file_mutation:
    header: "⚠️ फ़ाइल-बदलाव सत्यापक: ऊपर के कथन के बावजूद इस बारी {count} फ़ाइल संपादन विफल हुए। वास्तविक बदलाव देखने के लिए `git status` या `read_file` चलाएँ।"
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "विफल"
  shared:
    and_more: "  • … और {count} अन्य"
    the_model: "मॉडल"
tips:
  t001: "/bg <prompt> अलग सत्र में कार्य चलाता है, वर्तमान सत्र खाली रहता है; /btw <question> बिना बाधा इस बातचीत का अतिरिक्त प्रश्न हल करता है।"
  t002: "/branch वर्तमान सत्र की शाखा बनाता है ताकि प्रगति खोए बिना नई दिशा देखें।"
  t003: "/compress लंबी बातचीत का संदर्भ स्वयं संपीड़ित करता है।"
  t004: "/rollback फ़ाइल सिस्टम चेकपॉइंट देता है — एजेंट की बदली फ़ाइलें किसी पुरानी स्थिति पर बहाल करें।"
  t005: "/rollback diff 2 बिना बहाली चेकपॉइंट 2 के बाद के बदलाव दिखाता है।"
  t006: "/rollback 2 src/file.py खास चेकपॉइंट से एक फ़ाइल बहाल करता है।"
  t007: "/title \"my project\" सत्र नाम देता है — बाद में /resume या hermes -c से जारी करें।"
  t008: "/resume पहले नाम दिए सत्र में वहीं से जारी करता है जहाँ रुके थे।"
  t009: "/queue <prompt> वर्तमान बारी बाधित किए बिना अगली बारी का संदेश कतार में रखता है।"
  t010: "/undo बातचीत का अंतिम उपयोगकर्ता/सहायक आदान-प्रदान हटाता है।"
  t011: "/retry अंतिम संदेश फिर भेजता है — एजेंट उत्तर सही न हो तो उपयोगी।"
  t012: "/verbose टूल प्रगति बदलता है: off → new → all → verbose।"
  t013: "/reasoning high मॉडल का विचार गहरा करता है। /reasoning show तर्क-विचार दिखाता है।"
  t014: "/fast तेज़ API उत्तर के लिए प्राथमिकता प्रसंस्करण बदलता है (प्रदाता पर निर्भर)।"
  t015: "/yolo सत्र के शेष समय में खतरनाक कमांड अनुमति प्रश्न छोड़ता है।"
  t016: "/model बीच सत्र में मॉडल बदलता है — /model sonnet या /model gpt-5 आज़माएँ।"
  t017: "/model --global डिफ़ॉल्ट मॉडल स्थायी बदलता है।"
  t018: "/personality pirate मज़ेदार व्यक्तित्व सेट करता है — kawaii से shakespeare तक 14 बिल्ट-इन विकल्प।"
  t019: "/skin CLI थीम बदलता है — ares, mono, slate, poseidon या charizard आज़माएँ।"
  t020: "/statusbar मॉडल, टोकन, संदर्भ भराव %, लागत और अवधि की स्थायी पट्टी बदलता है।"
  t021: "/tools disable browser वर्तमान सत्र से ब्राउज़र टूल अस्थायी हटाता है।"
  t022: "/browser connect CDP से आपके चलते Chromium-आधारित ब्राउज़र के टूल जोड़ता है।"
  t023: "/plugins स्थापित प्लगइन और स्थिति दिखाता है।"
  t024: "/cron निर्धारित कार्य सँभालता है — नियमित प्रॉम्प्ट का परिणाम किसी प्लैटफ़ॉर्म पर भेजें।"
  t025: "/reload-mcp बिना पुनः शुरू किए MCP सर्वर सेटिंग फिर लोड करता है।"
  t026: "/usage टोकन उपयोग, लागत विवरण और सत्र अवधि दिखाता है।"
  t027: "/insights पिछले 30 दिन का उपयोग विश्लेषण दिखाता है।"
  t028: "/paste क्लिपबोर्ड का चित्र जाँचकर अगले संदेश में जोड़ता है।"
  t029: "/profile सक्रिय प्रोफ़ाइल और होम निर्देशिका दिखाता है।"
  t030: "/config वर्तमान सेटिंग एक नज़र में दिखाता है।"
  t031: "/stop एजेंट की शुरू की सभी पृष्ठभूमि प्रक्रियाएँ बंद करता है।"
  t032: "@file:path/to/file.py फ़ाइल सामग्री सीधे संदेश में जोड़ता है।"
  t033: "@file:main.py:10-50 केवल पंक्तियाँ 10-50 जोड़ता है।"
  t034: "@folder:src/ निर्देशिका वृक्ष सूची जोड़ता है।"
  t035: "@diff स्टेज न किए git बदलाव संदेश में जोड़ता है।"
  t036: "@staged स्टेज किए git बदलाव जोड़ता है (git diff --staged)।"
  t037: "@git:5 पूरे पैच सहित अंतिम 5 कमिट जोड़ता है।"
  t038: "@url:https://example.com वेब पृष्ठ की सामग्री लाकर जोड़ता है।"
  t039: "@ लिखने पर फ़ाइल सिस्टम पथ पूर्णता मिलती है — किसी फ़ाइल पर इंटरैक्टिव जाएँ।"
  t040: "कई संदर्भ जोड़ें: \"@file:main.py और @file:test.py की एकरूपता जाँचें।\""
  t041: "Alt+Enter नई पंक्ति जोड़ता है। (Windows Terminal Alt+Enter रोकता है — Ctrl+Enter इस्तेमाल करें।)"
  t042: "Ctrl+C एजेंट बाधित करता है। ज़बरदस्ती निकलने के लिए 2 सेकंड में दो बार दबाएँ।"
  t043: "Ctrl+Z {app_name} को पृष्ठभूमि में निलंबित करता है — शेल में fg से जारी करें।"
  t044: "Tab हल्के स्वतः सुझाव स्वीकार या स्लैश कमांड पूरे करता है।"
  t045: "एजेंट काम करते समय नया संदेश लिखकर बाधित करें और दिशा बदलें।"
  t046: "Alt+V क्लिपबोर्ड का चित्र बातचीत में पेस्ट करता है।"
  t047: "5+ पंक्तियाँ पेस्ट करने पर फ़ाइल स्वतः सहेजकर संक्षिप्त संदर्भ जुड़ता है।"
  t048: "hermes -c सबसे हालिया CLI सत्र जारी करता है। hermes -c \"project name\" शीर्षक से जारी करता है।"
  t049: "hermes -w अलग git वर्कट्री बनाता है — समानांतर एजेंट काम के लिए उपयुक्त।"
  t050: "hermes -w -q \"Fix issue #42\" अलग वर्कट्री में एक प्रश्न चलाता है।"
  t051: "noone chat -t web,terminal केंद्रित सत्र के लिए केवल खास टूल समूह चालू करता है।"
  t052: "noone chat -s github-pr-workflow शुरू होते स्किल लोड करता है।"
  t053: "noone chat -q \"query\" एक गैर-इंटरैक्टिव प्रश्न चलाकर निकलता है।"
  t054: "noone chat --max-turns 1000 प्रति-बारी डिफ़ॉल्ट 500 पुनरावृत्ति सीमा बदलता है।"
  t055: "noone chat --checkpoints हर विनाशकारी फ़ाइल बदलाव से पहले स्नैपशॉट चालू करता है।"
  t056: "noone --yolo पूरे सत्र की खतरनाक कमांड अनुमति छोड़ता है।"
  t057: "noone chat --source telegram सत्र को hermes sessions list में फ़िल्टर करने के लिए टैग देता है।"
  t058: "hermes -p work chat डिफ़ॉल्ट बदले बिना खास प्रोफ़ाइल में चलता है।"
  t059: "noone doctor --fix सेटिंग और निर्भरता समस्याएँ जाँचकर स्वतः सुधारता है।"
  t060: "hermes dump संक्षिप्त सेटअप सार देता है — बग रिपोर्ट में उपयोगी।"
  t061: "noone config set KEY VALUE गुप्त मान .env और बाकी config.yaml में भेजता है।"
  t062: "noone config edit डिफ़ॉल्ट संपादक में config.yaml खोलता है।"
  t063: "noone config check गैर-मौजूद या पुरानी सेटिंग जाँचता है।"
  t064: "hermes sessions browse खोज सहित इंटरैक्टिव सत्र चयन खोलता है।"
  t065: "hermes sessions stats प्लैटफ़ॉर्म के अनुसार सत्र संख्या और डेटाबेस आकार दिखाता है।"
  t066: "hermes sessions prune --older-than 30 पुराने सत्र साफ़ करता है।"
  t067: "noone skills search react --source skills-sh skills.sh की सार्वजनिक निर्देशिका खोजता है।"
  t068: "noone skills check स्थापित हब स्किल के मूल स्रोत अपडेट जाँचता है।"
  t069: "noone skills tap add myorg/skills-repo अपना GitHub स्किल स्रोत जोड़ता है।"
  t070: "noone skills snapshot export setup.json स्किल सेटिंग बैकअप या साझाकरण के लिए निर्यात करता है।"
  t071: "hermes mcp add github --command npx कमांड लाइन से MCP सर्वर जोड़ता है।"
  t072: "hermes mcp-serve स्वयं {app_name} को दूसरे एजेंटों के लिए MCP सर्वर बनाता है।"
  t073: "noone auth add क्रेडेंशियल क्रम के लिए कई API कुंजियाँ जोड़ता है।"
  t074: "hermes completion bash >> ~/.bashrc सभी कमांड और प्रोफ़ाइल में Tab पूर्णता चालू करता है।"
  t075: "noone logs -f agent.log का लाइव अनुसरण करता है। --level WARNING --since 1h आउटपुट छाँटता है।"
  t076: "noone backup आपके पूरे {app_name} होम की zip बैकअप बनाता है।"
  t077: "noone profile create coder अलग प्रोफ़ाइल बनाता है जो अपना कमांड बन जाती है।"
  t078: "noone profile create work --clone वर्तमान सेटिंग और कुंजियाँ नई प्रोफ़ाइल में कॉपी करता है।"
  t079: "noone update नए बंडल स्किल सभी प्रोफ़ाइल में स्वतः सिंक करता है।"
  t080: "noone gateway install {app_name} को सिस्टम सेवा (systemd/launchd) सेट करता है।"
  t081: "hermes memory setup बाहरी स्मृति प्रदाता (Honcho, Mem0 आदि) सेट करता है।"
  t082: "hermes webhook subscribe HMAC सत्यापन सहित घटना-आधारित वेबहुक मार्ग बनाता है।"
  t083: "पैसा बचाएँ: noone tools अनुपयोगी टूल बंद करता है, noone skills config स्किल घटाता है।"
  t084: "/reasoning low या /reasoning minimal विचार गहराई डिफ़ॉल्ट (medium) से घटाता है — तेज़, सस्ते उत्तर।"
  t085: "noone models दृष्टि, संपीड़न और सहायक काम सस्ते मॉडल पर भेजता है — मुख्य चैट मॉडल घटाए बिना पृष्ठभूमि टोकन लागत 85%+ कम।"
  t086: "लंबे कार्य पूरे होने पर घंटी के लिए config.yaml में display.bell_on_complete: true सेट करें।"
  t087: "मॉडल बनाते समय टोकन लाइव देखने के लिए display.streaming: true सेट करें।"
  t088: "मॉडल का क्रमिक तर्क-विचार देखने के लिए display.show_reasoning: true सेट करें।"
  t089: "कम खाली जगह और अधिक सघन जानकारी के लिए display.compact: true सेट करें।"
  t090: "एजेंट बाधित करने की जगह संदेश कतार में रखने के लिए display.busy_input_mode: queue या बीच कार्य /steer से जोड़ने के लिए steer सेट करें।"
  t091: "सत्र जारी करते पूरा इतिहास न दिखाने के लिए display.resume_display: minimal सेट करें।"
  t092: "स्वतः संपीड़न कब हो तय करने के लिए compression.threshold: 0.50 (डिफ़ॉल्ट: संदर्भ का 50%)।"
  t093: "प्रति-बारी अधिक टूल कदम के लिए agent.max_turns: 1000 सेट करें।"
  t094: "प्रति read_file अधिक सामग्री के लिए file_read_max_chars: 200000 सेट करें।"
  t095: "LLM से सुरक्षित कमांड स्वतः अनुमति और खतरनाक स्वतः अस्वीकार के लिए approvals.mode: smart सेट करें।"
  t096: "वैकल्पिक प्रदाता पर स्वतः जाने के लिए config.yaml में fallback_model सेट करें।"
  t097: "LLM को भेजने से पहले उपयोगकर्ता ID और फ़ोन नंबर हैश करने के लिए privacy.redact_pii: true।"
  t098: "एजेंट ब्राउज़ करते स्थानीय Chromium विंडो देखने के लिए browser.headed: true।"
  t099: "हमेशा git वर्कट्री बनाने के लिए config.yaml में worktree: true (hermes -w जैसा)।"
  t100: "वेब टूल से खास डोमेन रोकने के लिए security.website_blocklist.enabled: true।"
  t101: "क्रॉन शीर्ष/फ़ुटर बिना मूल एजेंट आउटपुट भेजने के लिए cron.wrap_response: false।"
  t102: "HERMES_TIMEZONE किसी IANA टाइमज़ोन से सर्वर टाइमज़ोन बदलता है।"
  t103: "config.yaml में वातावरण वेरिएबल प्रतिस्थापन: ${VAR_NAME} सिंटैक्स इस्तेमाल करें।"
  t104: "config.yaml के त्वरित कमांड बिना टोकन खर्च शेल कमांड तुरंत चलाते हैं।"
  t105: "config.yaml में agent.personalities के अंतर्गत अपने व्यक्तित्व परिभाषित करें।"
  t106: "provider_routing OpenRouter प्रदाता क्रम, अनुमति और निषेध सूची नियंत्रित करता है।"
  t107: "execute_code Python स्क्रिप्ट से {app_name} टूल प्रोग्राम द्वारा चलाता है — परिणाम संदर्भ से बाहर रहते हैं।"
  t108: "delegate_task अलग संदर्भ वाले अधिकतम 10 समकालीन उप-एजेंट डिफ़ॉल्ट बनाता है (delegation.max_concurrent_children)।"
  t109: "web_extract PDF URL पर काम करता है — PDF लिंक दें, Markdown में बदल देगा।"
  t110: "search_files ripgrep आधारित और grep से तेज़ है — टर्मिनल grep की जगह लें।"
  t111: "patch 9 फ़ज़ी मिलान तरीके इस्तेमाल करता है, मामूली खाली जगह अंतर से संपादन नहीं टूटता।"
  t112: "patch एक कॉल में कई फ़ाइलों के संपादन के लिए V4A फ़ॉर्मैट लेता है।"
  t113: "फ़ाइल न मिलने पर read_file मिलते नाम सुझाता है।"
  t114: "read_file दोहराव हटाता है — अपरिवर्तित फ़ाइल फिर पढ़ने पर छोटा संकेतक देता है।"
  t115: "browser.user_data_dir को फ़ोल्डर पर सेट करें ताकि स्थायी Chromium प्रोफ़ाइल में साइट लॉगिन सत्रों के बीच रहें।"
  t116: "browser.chromium_args स्थानीय ब्राउज़र सत्र में अतिरिक्त फ़्लैग जोड़ता है, जैसे --lang=de।"
  t117: "image_generate FLUX 2 Pro से चित्र और स्वतः 2 गुना आकार वृद्धि देता है।"
  t118: "text_to_speech पाठ को ऑडियो में बदलता है — Telegram पर वॉइस बबल में चलता है।"
  t119: "send_message सत्र से किसी जुड़े संदेश प्लैटफ़ॉर्म पर पहुँचता है।"
  t120: "todo टूल एजेंट को सत्र में जटिल बहु-चरण कार्य ट्रैक करने में मदद करता है।"
  t121: "session_search सभी पुरानी बातचीत में पूर्ण-पाठ खोज करता है।"
  t122: "एजेंट प्राथमिकताएँ, सुधार और वातावरण तथ्य स्मृति में स्वतः सहेजता है।"
  t123: "/moa एक कठिन प्रॉम्प्ट को सेट किए Mixture of Agents मॉडल समूह से चलाता है।"
  t124: "लंबे टर्मिनल कार्य notify_on_complete सहित पृष्ठभूमि मोड लेते हैं।"
  t125: "टर्मिनल पृष्ठभूमि प्रक्रियाएँ खास आउटपुट पंक्तियों की सूचना के लिए watch_patterns लेती हैं।"
  t126: "टर्मिनल टूल के 6 बैकएंड: local, Docker, SSH, Modal, Daytona और Singularity।"
  t127: "हर प्रोफ़ाइल की अपनी सेटिंग, API कुंजी, स्मृति, सत्र, स्किल और क्रॉन कार्य हैं।"
  t128: "प्रोफ़ाइल नाम शेल कमांड बनते हैं — 'noone profile create coder' से 'coder' कमांड बनता है।"
  t129: "noone profile export coder -o backup.tar.gz पोर्टेबल प्रोफ़ाइल संग्रह बनाता है।"
  t130: "दो प्रोफ़ाइल गलती से बॉट टोकन साझा करें तो दूसरा गेटवे स्पष्ट त्रुटि से रुकता है।"
  t131: "पहले आदान-प्रदान के बाद वर्णनात्मक सत्र शीर्षक स्वतः बनते हैं — स्वयं नाम नहीं देना।"
  t132: "सत्र शीर्षक क्रम बनाए रखते हैं: \"my project\" → \"my project #2\" → \"my project #3\"।"
  t133: "बाहर निकलते {app_name} सत्र ID और आँकड़ों सहित जारी करने का कमांड देता है।"
  t134: "hermes sessions export backup.jsonl सभी सत्र बैकअप या विश्लेषण के लिए निर्यात करता है।"
  t135: "hermes -r SESSION_ID ID से खास पुराना सत्र जारी करता है।"
  t136: "स्मृति स्थिर स्नैपशॉट है — बदलाव सिस्टम प्रॉम्प्ट में अगले सत्र की शुरुआत में ही आते हैं।"
  t137: "स्मृति प्रविष्टियाँ प्रॉम्प्ट इंजेक्शन और डेटा चोरी पैटर्न के लिए स्वतः जाँची जाती हैं।"
  t138: "एजेंट की दो स्मृति जगह: निजी नोट (~2200 अक्षर) और उपयोगकर्ता प्रोफ़ाइल (~1375 अक्षर)।"
  t139: "आपके सुधार (\"नहीं, ऐसे करो\") अक्सर स्मृति में स्वतः सहेजे जाते हैं।"
  t140: "github, रचनात्मकता, mlops, उत्पादकता, शोध आदि के 80 से अधिक बंडल स्किल।"
  t141: "हर स्थापित स्किल स्वतः स्लैश कमांड बनता है — सभी देखने के लिए / लिखें।"
  t142: "noone skills install official/security/1password रिपॉज़िटरी के वैकल्पिक स्किल स्थापित करता है।"
  t143: "स्किल खास OS तक सीमित हो सकते हैं — कुछ केवल macOS या Linux पर लोड होते हैं।"
  t144: "config.yaml में skills.external_dirs अपनी निर्देशिका से स्किल लोड करता है।"
  t145: "एजेंट skill_manage से प्रक्रियात्मक स्मृति के रूप में अपने स्किल बना सकता है।"
  t146: "/plan बिना कुछ चलाए .hermes/plans/ में Markdown कार्यान्वयन योजना लिखता है।"
  t147: "क्रॉन कार्य स्किल जोड़ सकते हैं: noone cron add --skill blogwatcher \"Check for new posts\"।"
  t148: "क्रॉन गंतव्य में telegram, discord, slack, email, sms और 12+ अन्य प्लैटफ़ॉर्म हैं।"
  t149: "क्रॉन उत्तर [SILENT] से शुरू हो तो वितरण नहीं होता — केवल निगरानी में उपयोगी।"
  t150: "क्रॉन सापेक्ष विलंब (30m), अंतराल (every 2h), क्रॉन अभिव्यक्ति और ISO समय चिह्न लेता है।"
  t151: "क्रॉन कार्य बिल्कुल नए एजेंट सत्र में चलते हैं — प्रॉम्प्ट आत्मनिर्भर होना चाहिए।"
  t152: "faster-whisper स्थापित हो तो वॉइस मोड बिना API कुंजी चलता है (मुफ़्त स्थानीय वाक्-से-पाठ)।"
  t153: "पाँच TTS प्रदाता: Edge TTS (मुफ़्त), ElevenLabs, OpenAI, NeuTTS (मुफ़्त स्थानीय), MiniMax।"
  t154: "/voice on CLI में वॉइस मोड चालू करता है। Ctrl+B दबाकर बोलने की रिकॉर्डिंग बदलता है।"
  t155: "स्ट्रीमिंग TTS बनते ही वाक्य बोलता है — पूरे उत्तर की प्रतीक्षा नहीं।"
  t156: "Telegram, Discord, WhatsApp और Slack के वॉइस संदेश स्वतः लिप्यंतरित होते हैं।"
  t157: "{app_name} Telegram, Discord, Slack, WhatsApp, Signal, Microsoft Teams, ईमेल और अन्य माध्यमों से संदेश भेजने की सुविधा देता है।"
  t158: "noone gateway install बूट पर शुरू होने वाली सिस्टम सेवा सेट करता है।"
  t161: "वेबहुक मार्ग HMAC सत्यापन, दर सीमा और घटना फ़िल्टर लेते हैं।"
  t162: "API सर्वर Open WebUI और LibreChat के लिए OpenAI-संगत एंडपॉइंट देता है।"
  t163: "Discord वॉइस चैनल मोड: बॉट VC में जुड़ता, बोली लिखता और बोलकर उत्तर देता है।"
  t164: "group_sessions_per_user: true समूह चैट में हर व्यक्ति का अलग सत्र देता है।"
  t165: "/sethome चैट को क्रॉन वितरण का मुख्य चैनल बनाता है।"
  t166: "गेटवे निष्क्रियता-आधारित समय सीमा लेता है — सक्रिय एजेंट असीमित चल सकते हैं।"
  t167: "खतरनाक कमांड अनुमति के 4 स्तर: once, session, always (स्थायी अनुमति सूची), deny।"
  t168: "स्मार्ट अनुमति मोड LLM से सुरक्षित कमांड को स्वतः अनुमति और खतरनाक को चिह्नित करता है।"
  t169: "SSRF सुरक्षा निजी नेटवर्क, लूपबैक, link-local और क्लाउड मेटाडेटा पते रोकती है।"
  t170: "सत्र ID समय उपसर्ग वाली (20250305_091523_abcd), ls और jq में स्वाभाविक क्रम मिलता है।"
  t171: "MCP उप-प्रक्रियाओं को छाँटा वातावरण मिलता है — केवल सुरक्षित सिस्टम वेरिएबल।"
  t172: "संदर्भ फ़ाइलें (.hermes.md, AGENTS.md) लोड होने से पहले प्रॉम्प्ट इंजेक्शन के लिए जाँची जाती हैं।"
  t173: "config.yaml में command_allowlist खास शेल पैटर्न को स्थायी अनुमति देता है।"
  t174: "सीमा पर संदर्भ स्वतः संपीड़ित होता है — स्मृति सहेजकर इतिहास का सार बनता है।"
  t175: "संदर्भ भरने पर स्थिति पट्टी पीली, फिर नारंगी, फिर लाल होती है।"
  t176: "SOUL.md एजेंट की मुख्य पहचान फ़ाइल — व्यवहार तय करने के लिए बदलें।"
  t177: "{app_name} .hermes.md, AGENTS.md, CLAUDE.md या .cursorrules से पहला मिला प्रोजेक्ट संदर्भ लोड करता है।"
  t178: "फ़ोल्डर में जाते समय उपनिर्देशिका की AGENTS.md फ़ाइलें क्रमशः मिलती हैं।"
  t179: "संदर्भ फ़ाइलें स्मार्ट शुरुआत/अंत कटौती सहित 20,000 अक्षर तक सीमित।"
  t180: "ब्राउज़र बैकएंड: स्थानीय Chromium, Lightpanda, Browserbase, Browser Use, Firecrawl — और प्लगइन Camofox।"
  t181: "Camofox (पहचान से बचने वाला Firefox) अब प्लगइन: noone plugins install camofox।"
  t182: "browser_exec एक Python कॉल में कई ब्राउज़र कदम — जाएँ, निकालें और क्लिक करें।"
  t183: "browser.dialog_policy पृष्ठ संवाद तय करता है: must_respond (एजेंट browser_dialog से उत्तर), auto_dismiss या auto_accept।"
  t184: "noone mcp एक कुंजी से स्थापित होने वाले समीक्षित MCP का इंटरैक्टिव चयन खोलता है।"
  t185: "noone mcp catalog रिपॉज़िटरी में आए समीक्षित MCP सर्वर दिखाता है।"
  t186: "hermes mcp install <name> कैटलॉग प्रविष्टि स्थापित करता, क्रेडेंशियल पूछता और चालू करने के टूल चुनने देता है।"
  t187: "MCP सर्वर config.yaml में सेट — stdio और HTTP दोनों संचार समर्थित।"
  t188: "प्रति-सर्वर टूल फ़िल्टर: tools.include अनुमति और tools.exclude निषेध सूची देता है।"
  t189: "MCP सर्वर रनटाइम में टूल समूह बनाते हैं — noone tools प्रति-प्लैटफ़ॉर्म बदल सकता है।"
  t190: "MCP OAuth: auth: oauth ब्राउज़र में PKCE सहित अनुमति चालू करता है।"
  t191: "फ़ाइल न बदले तो चेकपॉइंट का अतिरिक्त भार शून्य — डिफ़ॉल्ट चालू।"
  t192: "वापसी से पहले स्नैपशॉट स्वतः सहेजता है ताकि वापसी भी वापस लें।"
  t193: "/rollback बातचीत की बारी भी वापस लेता है, इसलिए एजेंट हटाए बदलाव याद नहीं रखता।"
  t194: "चेकपॉइंट ~/.hermes/checkpoints/ की छाया रिपॉज़िटरी लेते हैं — प्रोजेक्ट .git कभी नहीं छूते।"
  t195: "batch_runner.py प्रशिक्षण डेटा के लिए सैकड़ों प्रॉम्प्ट समानांतर चलाता है।"
  t196: "noone chat -Q प्रोग्राम उपयोग का शांत मोड — बैनर और स्पिनर छिपाता है।"
  t197: "कार्यक्रम पथ सहेजना (--save-trajectories) मॉडल प्रशिक्षण के पूरे टूल-उपयोग ट्रेस पकड़ता है।"
  t198: "तीन प्लगइन प्रकार: सामान्य (टूल/हुक), स्मृति प्रदाता और संदर्भ इंजन।"
  t199: "noone plugins install owner/repo सीधे GitHub से प्लगइन स्थापित करता है।"
  t200: "बाहरी स्मृति प्रदाता: Honcho, Hindsight, Mem0, OpenViking आदि, noone plugins install से।"
  t201: "प्लगइन हुक: pre/post_tool_call, pre/post_llm_call और आउटपुट सामान्यीकरण के लिए transform_terminal_output।"
  t202: "प्रॉम्प्ट कैशिंग (Anthropic) कैश किए सिस्टम प्रॉम्प्ट उपसर्ग दोबारा लेकर लागत घटाती है।"
  t203: "एजेंट पृष्ठभूमि थ्रेड में सत्र शीर्षक बनाता है — विलंब पर शून्य प्रभाव।"
  t204: "स्मार्ट मॉडल मार्ग सरल प्रश्न सस्ते मॉडल पर स्वतः भेज सकता है।"
  t205: "स्लैश कमांड उपसर्ग मिलान लेते हैं: /h से /help, /mod से /model।"
  t206: "फ़ाइल पथ टर्मिनल में खींचने पर चित्र स्वतः जुड़ते या संदर्भ भेजता है।"
  t207: "रिपॉज़िटरी रूट की .worktreeinclude में वर्कट्री में कॉपी करने वाली gitignored फ़ाइलें दें।"
  t208: "hermes acp VS Code, Zed और JetBrains एकीकरण के लिए {app_name} को ACP सर्वर चलाता है।"
  t209: "अपने प्रदाता: config.yaml में custom_providers के अंतर्गत नाम वाले एंडपॉइंट सहेजें।"
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT ऐसा सिस्टम प्रॉम्प्ट जोड़ता है जो इतिहास में कभी नहीं सहेजा जाता।"
  t211: "credential_pool_strategies fill_first, round_robin, least_used और random क्रम लेता है।"
  t212: "noone auth add nous या noone auth add openai-codex OAuth-आधारित प्रदाता सेट करता है।"
  t213: "API सर्वर सर्वर-पक्ष स्थिति सहित Chat Completions और Responses API दोनों लेता है।"
  t214: "सेटिंग में tool_preview_length: 0 स्पिनर गतिविधि में पूरे फ़ाइल पथ दिखाता है।"
  t215: "noone status --deep सभी घटकों का गहरा निदान चलाता है।"
  t216: "क्रॉन कार्य Python स्क्रिप्ट (--script) जोड़ सकते हैं जिसका stdout प्रॉम्प्ट में संदर्भ बनता है।"
  t217: "क्रॉन स्क्रिप्ट ~/.hermes/scripts/ में रहती और एजेंट से पहले चलती हैं — डेटा संग्रह में उपयोगी।"
  t218: "config.yaml में prefill_messages_file हर API कॉल में उदाहरण जोड़ता है, इतिहास में नहीं सहेजता।"
  t219: "SOUL.md डिफ़ॉल्ट एजेंट पहचान पूरी बदलता है — {app_name} को अपना बनाने के लिए लिखें।"
  t220: "पहले उपयोग पर SOUL.md में डिफ़ॉल्ट व्यक्तित्व स्वतः आता है। अपने अनुसार संपादित करें।"
  t221: "/compress <focus topic> सार सीमा का 60-70% आपके विषय को देता है और बाकी तेज़ी से घटाता है।"
  t222: "दूसरे और अगले संपीड़न में नया शुरू करने की जगह पिछला सार अपडेट होता है।"
  t223: "गेटवे सत्र रीसेट से पहले {app_name} महत्वपूर्ण तथ्य पृष्ठभूमि में स्मृति में सहेजता है।"
  t224: "config.yaml में network.force_ipv4: true खराब IPv6 वाले सर्वर का अटकना सुधारता है — socket में पैच करता है।"
  t225: "टर्मिनल टूल सामान्य निकास कोड समझाता है: grep का 1 = 'कोई मिलान नहीं (त्रुटि नहीं)'।"
  t226: "विफल अग्रभूमि टर्मिनल कमांड बढ़ते विलंब (2s, 4s, 8s) सहित 3 बार स्वतः कोशिश करते हैं।"
  t227: "सादा sudo कमांड .env का SUDO_PASSWORD पाइप करने के लिए स्वतः बदलता है — इंटरैक्टिव प्रश्न नहीं।"
  t228: "execute_code सहायक के लिए स्पष्ट आयात: from hermes_tools import json_parse, shell_quote, retry।"
  t229: "execute_code के 7 सैंडबॉक्स टूल (web_search, terminal, read/write/search/patch) RPC लेते हैं — संदर्भ में नहीं आते।"
  t230: "एक फ़ाइल भाग 3+ बार पढ़ने पर चेतावनी। 4+ पर लूप रोकने के लिए प्रतिबंध।"
  t231: "write_file और patch पिछली पढ़ाई के बाद बाहरी फ़ाइल बदलाव पहचानकर पुराने डेटा की चेतावनी देते हैं।"
  t232: "V4A पैच Add File, Delete File और Move File निर्देश लेता है — केवल Update नहीं।"
  t233: "MCP सर्वर sampling से LLM उत्तर माँग सकते हैं — एजेंट सर्वर का टूल बन जाता है।"
  t234: "MCP सर्वर notifications/tools/list_changed से बिना पुनः शुरू स्वतः टूल फिर पंजीकृत कराते हैं।"
  t235: "acp_command: 'claude' सहित delegate_task किसी प्लैटफ़ॉर्म से Claude Code उप-एजेंट बनाता है।"
  t236: "कार्य सौंपने में हार्टबीट थ्रेड — उप-एजेंट गतिविधि मुख्य तक पहुँचकर गेटवे समय सीमा बचाती है।"
  t237: "प्रदाता HTTP 402 (भुगतान चाहिए) दे तो सहायक क्लाइंट अगले प्रदाता पर जाता है।"
  t238: "agent.tool_use_enforcement कार्रवाई बताने वाले मॉडल को टूल चलाने का निर्देश देता है — GPT/Codex के लिए स्वतः।"
  t239: "agent.restart_after_turn_timeout /restart के stop() में जाने से पहले जारी बारियाँ पूरी होने देता है; restart_drain_timeout केवल stop() शुरू होने के बाद ज़बरदस्ती बाधा की सीमा है।"
  t240: "agent.api_max_retries (डिफ़ॉल्ट 3) त्रुटि दिखाने से पहले विफल API कॉल की कोशिशें तय करता है — तेज़ विकल्प के लिए घटाएँ।"
  t241: "गेटवे प्रति-सत्र AIAgent कैश रखता है — इसे मिटाने से Anthropic प्रॉम्प्ट कैशिंग टूटती है।"
  t242: "कोई वेबसाइट /.well-known/skills/index.json से स्किल दे सकती है — स्किल हब स्वतः खोजता है।"
  t243: "~/.hermes/skills/.hub/audit.log हर स्किल स्थापना और हटाने को ट्रैक करता है।"
  t244: "पुरानी git वर्कट्री स्वतः साफ़: साफ़ मर्ज वर्कट्री हटती; निष्क्रिय बदली या पुश न की पहले संग्रह और hermes worktree restore से बहाल होती हैं।"
  t245: "प्रोफ़ाइल HERMES_HOME से {app_name} स्थिति बाँधती हैं; होस्ट टूल उप-प्रक्रियाएँ वास्तविक HOME रखती हैं जब तक terminal.home_mode profile न हो।"
  t246: "HERMES_HOME_MODE वातावरण वेरिएबल (ऑक्टल, जैसे 0701) वेब सर्वर के लिए निर्देशिका अनुमति सेट करता है।"
  t247: "कंटेनर मोड: HERMES_HOME में .container-mode रखें, होस्ट CLI स्वतः कंटेनर में चलेगा।"
  t248: "Ctrl+C की 5 प्राथमिकताएँ: रिकॉर्डिंग रद्द → प्रश्न रद्द → चयन रद्द → एजेंट बाधित → बाहर।"
  t249: "एजेंट कार्य के दौरान हर बाधा समय चिह्न सहित ~/.hermes/interrupt_debug.log में दर्ज होती है।"
  t250: "BROWSER_CDP_URL चलते Chromium-आधारित ब्राउज़र से टूल जोड़ता है — WebSocket, HTTP या host:port लेता है।"
  t251: "BROWSERBASE_ADVANCED_STEALTH=true खास Chromium से उन्नत पहचान-बचाव चालू करता है (Scale Plan)।"
  t252: "80 कॉलम से सँकरे टर्मिनल में CLI स्वतः संक्षिप्त मोड लेता है।"
  t253: "त्वरित कमांड के दो प्रकार: exec (सीधे शेल कमांड) और alias (दूसरे कमांड पर भेजें)।"
  t254: "प्रति-कार्य मॉडल: सेटिंग में delegation.model और delegation.provider उप-एजेंट सस्ते मॉडल पर भेजते हैं।"
  t255: "delegation.reasoning_effort उप-एजेंट की विचार गहराई स्वतंत्र तय करता है।"
  t256: "config.yaml में display.platforms प्रति-प्लैटफ़ॉर्म प्रदर्शन बदलाव लेता है: {telegram: {tool_progress: all}}।"
  t257: "सेटिंग में human_delay.mode मानवीय टाइपिंग गति जैसा विलंब — min_ms/max_ms सीमा तय करें।"
  t258: "सेटिंग संस्करण परिवर्तन लोड पर स्वतः चलते हैं — नई कुंजियाँ स्वयं आती हैं।"
  t259: "GPT और Codex को टूल अनुशासन और अनिवार्य उपयोग के खास सिस्टम निर्देश मिलते हैं।"
  t260: "Gemini को पूर्ण पथ, समानांतर टूल कॉल और गैर-इंटरैक्टिव कमांड के खास निर्देश मिलते हैं।"
  t261: "वैकल्पिक संदर्भ प्रबंधन के लिए config.yaml में context.engine प्लगइन नाम हो सकता है।"
  t262: "क्लाउड ब्राउज़र में localhost और LAN URL स्थानीय Chromium में खुलते हैं (browser.auto_local_for_private_urls, डिफ़ॉल्ट चालू)।"
  t263: "संपीड़क का सस्ता प्रारंभिक चरण: LLM से पहले 200 अक्षर से बड़े टूल आउटपुट संकेतक से बदलते हैं।"
  t264: "संपीड़न विफल हो तो API पर भार बचाने के लिए आगे प्रयास 10 मिनट रुकते हैं।"
  t265: "लंबे खतरनाक कमांड (>70 अक्षर) में अनुमति प्रश्न का 'view' विकल्प पहले पूरा पाठ दिखाता है।"
  t266: "वॉइस रिकॉर्डिंग में माइक्रोफ़ोन RMS स्तर के अनुसार ▁▂▃▄▅▆▇ ऑडियो पट्टियाँ दिखती हैं।"
  t267: "प्रोफ़ाइल नाम मौजूदा PATH बाइनरी से नहीं मिल सकते — 'noone profile create ls' अस्वीकृत होगा।"
  t268: "noone profile create backup --clone-all सब कॉपी करता है (सेटिंग, कुंजी, SOUL.md, स्मृति, स्किल, सत्र)।"
  t269: "config.yaml में voice.record_key से वॉइस रिकॉर्डिंग कुंजी बदलें — केवल Ctrl+B नहीं।"
  t270: ".cursorrules और .cursor/rules/*.mdc स्वतः मिलकर प्रोजेक्ट संदर्भ में लोड होते हैं।"
  t271: "संदर्भ फ़ाइल जाँच 10+ प्रॉम्प्ट इंजेक्शन पैटर्न पहचानती है — अदृश्य Unicode, 'निर्देश अनदेखे करें', डेटा चोरी प्रयास।"
  t272: "GPT-5 और Codex संदेश फ़ॉर्मैट में 'system' की जगह 'developer' भूमिका लेते हैं।"
  t273: "प्रति-कार्य सहायक बदलाव: config.yaml में auxiliary.vision.provider, auxiliary.compression.model आदि।"
  t274: "सहायक क्लाइंट 'main' को प्रदाता उपनाम मानता है — वास्तविक मुख्य प्रदाता और मॉडल मिलता है।"
  t275: "noone import-agent openclaw --dry-run बिना लेखन OpenClaw स्थानांतरण दिखाता है।"
  t276: "उद्धरण या escaped स्पेस सहित पेस्ट फ़ाइल पथ स्वतः सँभलते हैं — स्वयं सफ़ाई नहीं।"
  t277: "स्लैश कमांड कभी बड़े पेस्ट को नहीं समेटते — बड़े तर्क वाला /command सही चलता है।"
  t278: "बाधा मोड में एजेंट चलते लिखे स्लैश कमांड बाधा तर्क छोड़कर तुरंत चलते हैं।"
  t279: "HERMES_DEV=1 स्थानीय विकास में कंटेनर मोड पहचान छोड़ता है।"
  t280: "हर MCP सर्वर का अपना टूल समूह (mcp-servername) है, noone tools से स्वतंत्र बदलें।"
  t281: "सेटिंग के MCP ${ENV_VAR} संकेतक सर्वर शुरू होते हल होते हैं — ~/.hermes/.env वेरिएबल भी।"
  t282: "विश्वसनीय रिपॉज़िटरी (जैसे openai/skills) के स्किल का सुरक्षा स्तर 'trusted'; सामुदायिक स्किल अतिरिक्त जाँच लेते हैं।"
  t283: "~/.hermes/skills/.hub/quarantine/ में सुरक्षा समीक्षा लंबित स्किल रहते हैं।"
  t284: "/steer <prompt> अगली टूल कॉल के बाद नोट जोड़ता है — बिना बाधा बीच कार्य दिशा बदलें।"
  t285: "/goal <text> स्थायी Ralph-loop लक्ष्य सेट करता है — निर्णायक पूरा कहने तक {app_name} बारी दर बारी चलता है।"
  t286: "/snapshot create [label] पूरी {app_name} सेटिंग स्थिति सहेजता है; /snapshot restore <id> बाद में बहाल करता है।"
  t287: "/copy [N] सहायक का अंतिम उत्तर क्लिपबोर्ड में कॉपी करता है, संख्या दें तो अंत से Nवाँ।"
  t288: "/redraw पूरा UI फिर बनाकर tmux आकार या माउस चयन के बाद टर्मिनल गड़बड़ी सुधारता है।"
  t289: "/agents (उपनाम /tasks) सत्र के सक्रिय एजेंट और पृष्ठभूमि कार्य दिखाता है।"
  t290: "/footer अंतिम उत्तर में मॉडल, संदर्भ % और cwd का गेटवे फ़ुटर बदलता है।"
  t291: "/busy queue|steer|interrupt तय करता है कि {app_name} काम करते Enter क्या करे।"
  t292: "Telegram निजी चैट में /topic उपयोगकर्ता-प्रबंधित बहु-सत्र विषय मोड चालू करता है — /topic <id> पुराने सत्र वहीं बहाल करता है।"
  t293: "/approve session|always चुने विश्वास दायरे में लंबित खतरनाक कमांड चलाता है; /deny अस्वीकार करता है।"
  t294: "/restart सक्रिय काम पूरा होने पर गेटवे व्यवस्थित पुनः शुरू करता है और लौटने पर अनुरोधकर्ता को बताता है।"
  t295: "/kanban boards switch <slug> चैट से सक्रिय बहु-प्रोजेक्ट Kanban बोर्ड बदलता है।"
  t296: "/reload चलते सत्र में ~/.hermes/.env फिर लोड करता है — बिना पुनः शुरू नई API कुंजियाँ लें।"
  t297: "no_agent=True सहित cronjob स्क्रिप्ट निर्धारित समय चला कर stdout सीधे भेजता है — शून्य टोकन, शून्य LLM।"
  t298: "क्रॉन स्क्रिप्ट का खाली stdout शांत टिक है — कुछ नहीं भेजता, सीमा निगरानी में उपयोगी।"
  t299: "HERMES_CRON_MAX_PARALLEL (डिफ़ॉल्ट 4) प्रति-टिक क्रॉन संख्या सीमित करता है ताकि कुंजियों पर अचानक भार न पड़े।"
  t300: "गेटवे हुक ~/.hermes/hooks/<name>/ में HOOK.yaml + handler.py के साथ — हैंडलर का नाम `handle` हो।"
  t301: "हुक घटनाएँ: gateway:startup, session:start, agent:step और command:* वाइल्डकार्ड सदस्यताएँ।"
  t302: "~/.hermes/BOOT.md जाँचसूची रखें, gateway:startup हुक हर बूट में एक एजेंट कार्य चलाता है।"
  t303: "hermes curator run --dry-run बिना बदलाव क्यूरेटर का संभावित संग्रह/संयोजन दिखाता है।"
  t304: "hermes curator pin <skill> स्किल को स्वतः संग्रह और एजेंट skill_manage दोनों से सुरक्षित करता है।"
  t305: "hermes curator rollback कार्य-पूर्व स्नैपशॉट से स्किल बहाल करता है — बैकअप skills/.curator_backups/ में।"
  t306: "noone auth reset <provider> [target] पूरे क्रेडेंशियल समूह या क्रमांक, ID, लेबल से एक का विराम और समाप्ति संकेत साफ़ करता है।"
  t307: "credential_pool_strategies.<provider>: round_robin fill_first डिफ़ॉल्ट की जगह कुंजियाँ बराबर क्रम में लेता है।"
  t308: "प्रति-टूल use_gateway: true वेब, चित्र, tts या ब्राउज़र को Nous सदस्यता से चलाता है — अतिरिक्त कुंजी नहीं।"
  t309: "provider_routing.data_collection: deny OpenRouter पर डेटा सहेजने वाले प्रदाता हटाता है।"
  t310: "provider_routing.require_parameters: true केवल अनुरोध के सभी पैरामीटर समर्थित प्रदाता लेता है।"
  t311: "HERMES_TUI_RESUME=1 शुरुआत पर सबसे हालिया TUI सत्र से स्वतः जुड़ता है — SSH टूटने के बाद उपयोगी।"
  t312: "HERMES_TUI_THEME=light|dark|<hex> COLORFGBG न सेट करने वाले टर्मिनल में TUI थीम तय करता है।"
  t313: "TUI में Ctrl+G या Ctrl+X Ctrl+E लंबे बहुपंक्ति प्रॉम्प्ट का इनपुट $EDITOR में खोलता है।"
  t314: "TUI LaTeX वहीं दिखाता है — $E=mc^2$ मूल TeX की जगह Unicode गणित बनता है।"
  t315: "noone dashboard 127.0.0.1:9119 पर स्थानीय वेब UI चलाता है — डेटा localhost से बाहर नहीं।"
  t316: "noone dashboard xterm.js और WebSocket PTY से पूरा {app_name} TUI ब्राउज़र में दिखाता है।"
  t317: "~/.hermes/dashboard-themes/ में दो पैलेट रंग वाली YAML रखें और पूरा डैशबोर्ड रूप बदलें।"
  t318: "डैशबोर्ड प्लगइन सीधे रखें: ~/.hermes/dashboard-plugins/ में manifest.json + JS बंडल — npm बिल्ड नहीं।"
  t319: "डैशबोर्ड थीम में layoutVariant: cockpit 260px बायाँ भाग जोड़ता है जिसे प्लगइन sidebar स्लॉट से भरते हैं।"
  t320: "display.tool_progress_command: true संदेश प्लैटफ़ॉर्म पर /verbose देता है; डिफ़ॉल्ट केवल CLI।"
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result केवल पृष्ठभूमि कार्य पूरा होने पर बताता है (अन्य concise/all/error/off)।"
  t322: "HERMES_WRITE_SAFE_ROOT write_file/patch को निर्देशिका उपसर्ग तक सीमित करता है; कई पथ os.pathsep (: या ;) से।"
  t323: "HERMES_IGNORE_RULES AGENTS.md, SOUL.md, .cursorrules, स्मृति और पहले लोड स्किल का स्वतः जोड़ना छोड़ता है।"
  t324: "HERMES_ACCEPT_HOOKS config.yaml के अनदेखे शेल हुक को बिना TTY प्रश्न स्वतः अनुमति देता है।"
  t325: "auxiliary.goal_judge.model /goal निर्णायक को सस्ते तेज़ मॉडल पर भेजकर लूप लागत लगभग शून्य रखता है।"
  t326: "बड़े monorepo में धीमे git से बचने के लिए चेकपॉइंट 50,000 से अधिक फ़ाइल वाली निर्देशिका छोड़ते हैं।"
  t327: "tts.provider: piper CPU पर 44 भाषा का स्थानीय TTS चलाता है — आवाज़ें ~/.hermes/cache/piper-voices/ में स्वतः डाउनलोड।"
  t328: "tts.providers.<name>.type: command {input_path} और {output_path} संकेतकों से कोई CLI TTS इंजन जोड़ता है।"
  t329: "API_SERVER_ENABLED=true गेटवे के साथ Open WebUI और LibreChat का OpenAI-संगत एंडपॉइंट चलाता है।"
  t330: "GATEWAY_PROXY_URL विभाजित सेटअप: प्लैटफ़ॉर्म I/O स्थानीय, एजेंट काम दूरस्थ API सर्वर को।"
  t332: "TELEGRAM_WEBHOOK_URL सेट हो तो TELEGRAM_WEBHOOK_SECRET आवश्यक — openssl rand -hex 32 से बनाएँ।"
  t333: "batch_runner.py --resume पूरे प्रॉम्प्ट को पाठ से मिलाता है ताकि डेटा क्रम बदलने पर पूरा काम फिर न चले।"
  t334: "/new वहीं नया सत्र शुरू करता है (उपनाम /reset) — नई ID, साफ़ इतिहास, CLI खुला रहता है।"
  t335: "/clear स्क्रीन साफ़ करके नया सत्र शुरू करता है — दृश्य रीसेट का एक शॉर्टकट।"
  t336: "/history CLI छोड़े बिना वर्तमान बातचीत वहीं दिखाता है — जल्दी फिर पढ़ें।"
  t337: "/save सत्र समाप्त किए बिना वर्तमान बातचीत डिस्क पर लिखता है।"
  t338: "/status सत्र की ID, शीर्षक, मॉडल, टोकन उपयोग और बीता समय दिखाता है।"
  t339: "/image <path> बिना पेस्ट या खींचे अगले प्रॉम्प्ट में स्थानीय चित्र जोड़ता है।"
  t340: "/platforms चैट से गेटवे और संदेश प्लैटफ़ॉर्म कनेक्शन दिखाता है।"
  t341: "/commands सभी स्लैश कमांड और स्थापित स्किल पृष्ठवार देता है — Tab पूर्णता बिना उपयोगी।"
  t342: "/toolsets सभी उपलब्ध टूल समूह देता है ताकि -t/--toolsets के मान जानें।"
  t343: "/voice tts केवल-TTS मोड बदलता है — एजेंट बोलता है लेकिन प्रॉम्प्ट आप लिखते हैं।"
  t344: "/reload-skills ~/.hermes/skills/ फिर जाँचता है ताकि नए स्किल बिना सत्र पुनः शुरू दिखें।"
  t346: "/debug सहायता बंडल (सिस्टम जानकारी और लॉग) अपलोड कर साझा लिंक देता है — चैट में भी।"
  t347: "hermes -z \"<prompt>\" केवल अंतिम उत्तर stdout पर देता है — स्क्रिप्ट पाइप में उपयोगी।"
  t348: "noone chat --pass-session-id सिस्टम प्रॉम्प्ट में सत्र ID जोड़ता है ताकि एजेंट स्वयं संदर्भ दे।"
  t349: "noone chat --image path/to/pic.png अलग अपलोड बिना एक -q प्रश्न में स्थानीय चित्र जोड़ता है।"
  t350: "noone chat --ignore-user-config सक्रिय उपयोगकर्ता सेटिंग छोड़ता है — पुनरुत्पादित बग रिपोर्ट और CI कार्य।"
  t351: "noone chat --source tool प्रोग्राम चैट टैग करता है ताकि hermes sessions list न भरें।"
  t352: "hermes dump --show-keys गहरे सहायता डीबग के लिए छिपाए API कुंजी फ़िंगरप्रिंट देता है।"
  t353: "hermes sessions rename <ID> \"new title\" पुराना सत्र नाम बदलता है; hermes sessions delete <ID> मिटाता है।"
  t354: "noone import पूरी {app_name} बैकअप zip बहाल करता है; सत्र JSON/JSONL डैशबोर्ड के सत्र पृष्ठ से आयात होते हैं।"
  t355: "hermes fallback fallback_model शृंखला इंटरैक्टिव सँभालता है — config.yaml हाथ से संपादन नहीं।"
  t356: "hermes pairing निजी संदेश पेयरिंग टोकन बदलता है — बदलाव के बाद पहला प्रेषक बॉट पहुँच पाता है।"
  t357: "noone setup पहले उपयोग में प्रदाता, कुंजी और प्लैटफ़ॉर्म को एक इंटरैक्टिव प्रवाह में जोड़ता है।"
  t358: "noone status --deep हर घटक की पूरी स्वास्थ्य जाँच; सादा noone status त्वरित दृश्य।"
  t359: "HERMES_AGENT_TIMEOUT=0 चलते एजेंट का गेटवे निष्क्रियता प्रतिबंध हटाता है — लंबे शोध के लिए।"
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 ./.hermes/plugins/ से स्थानीय प्लगइन स्वतः लोड करता है — विश्वास अनुमति आवश्यक।"
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 patch और write_file पर 'पढ़ने के बाद फ़ाइल बदली' सुरक्षा बंद करता है।"
  t362: "HERMES_ALLOW_PRIVATE_URLS=true वेब टूल को localhost और निजी नेटवर्क देता है — गेटवे मोड में डिफ़ॉल्ट बंद।"
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 प्रति-प्रोफ़ाइल पहले उपयोग पर अतिरिक्त वैकल्पिक कैटलॉग स्किल स्थापित करता है।"
  t364: "HERMES_BUNDLED_SKILLS खास बंडल स्किल वृक्ष देता है — Homebrew और Nix पैकेजिंग में उपयोग।"
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 हर API अनुरोध लॉग की जगह stdout में देता है।"
  t366: "HERMES_OAUTH_TRACE=1 प्रदाता प्रमाणीकरण डीबग के लिए गोपनीय मान हटाए OAuth विनिमय और ताज़ा प्रयास लॉग करता है।"
  t367: "HERMES_STREAM_RETRIES (डिफ़ॉल्ट 3) अस्थायी नेटवर्क त्रुटि पर बीच स्ट्रीम फिर जुड़ने की कोशिशें तय करता है।"
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false व्यस्त एजेंट को संदेश देने पर ⚡/⏳/⏩ स्वीकृति संदेश बंद करता है।"
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (डिफ़ॉल्ट 180s) लंबी बारी में गेटवे प्रगति सूचना का अंतराल तय करता है।"
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (डिफ़ॉल्ट 900s) ज़बरदस्ती रोकने से पहले /restart की प्रतीक्षा सीमा तय करता है।"
  t371: "HERMES_CHECKPOINT_TIMEOUT (डिफ़ॉल्ट 30s) चेकपॉइंट बनाने की समय सीमा — विशाल monorepo में बढ़ाएँ।"
  t372: "config.yaml में image_gen.model FAL मॉडल चुनता है: flux-2/klein, gpt-image-2, nano-banana-pro आदि।"
  t373: "image_gen.provider चित्र निर्माण डिफ़ॉल्ट की जगह प्लगइन (OpenAI Images, Codex, FAL) से करता है।"
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY दृष्टि विश्लेषण को किसी OpenAI-संगत एंडपॉइंट पर भेजते हैं।"
  t375: "API_SERVER_MODEL_NAME /v1/models का मॉडल नाम बदलता है — बहु-प्रोफ़ाइल Open WebUI में ज़रूरी।"
  t376: "डैशबोर्ड प्लगइन /dashboard-plugins/<name>/ से मिलते हैं — फ़ाइलें ~/.hermes/dashboard-plugins/ में रखें।"
  t377: "--source tool चैट डिफ़ॉल्ट hermes sessions list में नहीं — देखने के लिए --source स्पष्ट सेट करें।"
