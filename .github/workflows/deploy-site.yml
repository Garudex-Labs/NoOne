name: Release Docs Source and Publish Shared Resources

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/**'
      - 'optional-skills/**'
      # Catalog entry/removal merges must republish /docs/api/plugin-catalog.json —
      # installed clients fetch it for live catalog refresh.
      - 'plugin-catalog/**'
      - 'agent_cli/data/application_identity.json'
      - 'justfile'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      skills_index_run_id:
        description: 'Optional Build Skills Index run ID whose skills-index artifact should be published with shared resources'
        required: false
        type: string
      rebuild_skills_index:
        description: 'Force a fresh multi-source crawl instead of reusing the latest healthy index'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-source-and-resources:
    name: Native docs source artifact and Pages shared resources only
    if: github.repository == 'Garudex-Labs/NoOne'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          fetch-depth: 0  # extract-plugins.py derives each catalog entry's added/updated dates from git log

      - name: Set up the locked site toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          node-package-manager: npm
          node-cache-dependency-path: website/package-lock.json

      - name: Install ruamel.yaml for skill extraction
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages ruamel.yaml==0.18.17 httpx==0.28.1

      - name: Prepare skills index (unified multi-source catalog)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SKILLS_INDEX_RUN_ID: ${{ github.event.inputs.skills_index_run_id || '' }}
          REBUILD_SKILLS_INDEX: ${{ github.event.inputs.rebuild_skills_index || 'false' }}
        run: |
          # The unified external catalog is expensive to crawl and can burn
          # through the repository installation's GitHub API quota when several
          # docs deploys land close together.  Normal docs deploys therefore
          # reuse the latest healthy catalog: first the artifact from a
          # scheduled skills-index run, then the currently live index.  Only a
          # manual force rebuild does a fresh crawl here.
          #
          # If we do crawl, the build remains fatal. build_skills_index.py runs
          # the health check BEFORE writing and exits non-zero on source
          # collapse, keeping the last good Pages deployment live instead of
          # publishing a degenerate catalog.
          set -euo pipefail
          INDEX_PATH="website/docs/api/skills-index.json"
          mkdir -p "$(dirname "$INDEX_PATH")"

          validate_index() {
            python3 - "$INDEX_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(f"invalid skills index JSON: {exc}", file=sys.stderr)
              sys.exit(1)
          skills = data.get("skills")
          if not isinstance(skills, list) or len(skills) < 1500:
              count = len(skills) if isinstance(skills, list) else "missing"
              print(f"skills index too small: {count}", file=sys.stderr)
              sys.exit(1)
          print(f"skills index ready: {len(skills)} skills")
          PY
          }

          if [ "$REBUILD_SKILLS_INDEX" = "true" ]; then
            python3 scripts/build_skills_index.py
            validate_index
            exit 0
          fi

          if [ -n "$SKILLS_INDEX_RUN_ID" ]; then
            tmpdir="$(mktemp -d)"
            echo "Downloading skills-index artifact from run $SKILLS_INDEX_RUN_ID"
            if gh run download "$SKILLS_INDEX_RUN_ID" --name skills-index --dir "$tmpdir"; then
              candidate="$(find "$tmpdir" -name skills-index.json -type f | head -n 1 || true)"
              stars="$(find "$tmpdir" -name plugin-stars.json -type f | head -n 1 || true)"
              [ -n "$stars" ] && cp "$stars" website/docs/api/plugin-stars.json
              if [ -n "$candidate" ]; then
                cp "$candidate" "$INDEX_PATH"
                if validate_index; then
                  exit 0
                fi
              fi
            fi
            echo "::warning::Could not use skills-index artifact from run $SKILLS_INDEX_RUN_ID; trying live index"
          fi

          echo "Downloading currently live skills index"
          if curl -fsSL --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 5 \
            "https://hermes-agent.nousresearch.com/docs/api/skills-index.json" \
            -o "$INDEX_PATH" && validate_index; then
            exit 0
          fi

          echo "::warning::Live skills index unavailable or unhealthy; falling back to a fresh crawl"
          rm -f "$INDEX_PATH"
          python3 scripts/build_skills_index.py
          validate_index

      - name: Extract skill metadata
        run: python3 website/scripts/extract-skills.py

      # Star counts drive the catalog ranking. Same rule as the skills index: GitHub is only
      # probed by the scheduled skills-index run; deploys reuse its artifact (downloaded above
      # into website/docs/api/ when SKILLS_INDEX_RUN_ID is set) or the live site's copy.
      # Never calls the GitHub API.
      - name: Reuse plugin GitHub stars (no API calls)
        run: python3 website/scripts/fetch-plugin-stars.py

      - name: Extract plugin catalog for the Plugins page
        run: python3 website/scripts/extract-plugins.py

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: just docs-install

      - name: Refresh local documentation indexes
        run: just docs-generate-data

      - name: Validate the complete native documentation source
        run: |
          just docs-build
          npm run check:links --prefix website

      - name: Prepare complete documentation source release
        run: just docs-release-source _docs_source

      - name: Upload complete prepared source artifact (not an HTML deployment)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-docs-source
          path: |
            _docs_source/
            _docs_source-report.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

      - name: Stage shared API, OAuth, image and LLM feeds only
        run: just docs-stage-resources _docs_source _site

      # Pages rejects or stalls on artifacts over 1 GB compressed, surfacing as a
      # deploy timeout rather than an error. Fail here with the real size instead.
      - name: Check artifact size
        run: |
          set -euo pipefail
          published_limit=$((1024 * 1024 * 1024))
          published_size=$(du -sb _site | cut -f1)
          if [ "$published_size" -gt "$published_limit" ]; then
            echo "::error::Shared documentation resources are $((published_size / 1024 / 1024)) MiB, over the 1 GiB Pages limit. Choose a suitable documentation host; do not omit source pages to reduce the size."
            exit 1
          fi
          limit=$((900 * 1024 * 1024))
          size=$(tar -cf - -C _site . | gzip -6 | wc -c)
          echo "compressed artifact: $((size / 1024 / 1024)) MiB (limit $((limit / 1024 / 1024)) MiB)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::Pages artifact is $((size / 1024 / 1024)) MiB compressed, over the $((limit / 1024 / 1024)) MiB budget (Pages caps at 1 GB). Check the shared-resource publication contents; full HTML belongs on a capable documentation host."
            exit 1
          fi

      - name: Upload Pages shared-resource artifact (no full documentation HTML)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Publish shared resources to existing GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

      - name: Report source release and resource-only publication scope
        env:
          RESOURCE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          {
            echo '## Documentation source release'
            echo '- Complete native-validated content: prepared-docs-source artifact.'
            echo "- Shared API/OAuth/static resources: $RESOURCE_URL"
            echo '- Full HTML documentation hosting is not configured or deployed by this workflow.'
            echo '- Static export remains an explicit optional operation for a separately approved capable host.'
          } >> "$GITHUB_STEP_SUMMARY"
