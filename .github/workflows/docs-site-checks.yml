name: Docs Site Checks

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      - name: Set up the locked site toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          node-package-manager: npm
          node-cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: just docs-install

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages ascii-guard==2.3.0 ruamel.yaml==0.18.17

      - name: Regenerate per-skill documentation and navigation
        run: just docs-generate

      - name: Committed skill docs match the generator
        run: just docs-check-generated

      - name: Check cross-page links resolve on GitHub and on the site
        run: just docs-check-links

      - name: Lint docs diagrams
        run: just docs-lint-diagrams

      - name: Test documentation publishing helpers
        run: npm test --prefix website

      - name: Validate documentation
        run: just docs-build

      - name: Check routes, anchors, imports and redirects
        run: npm run check:links --prefix website
